# _config.yml

title: Philip White

remote_theme: "mmistakes/minimal-mistakes"

author:
  avatar: /assets/images/headshot_background.jpg
  bio: |
    Assistant Professor<br>
    Brigham Young University<br>
    Department of Statistics<br>
    School of Medicine

plugins:
  - jekyll-include-cache
  - jekyll-scholar

include:
  - _pages
  - _bibliography

scholar:
  style: apa
  source: ./_bibliography
  bibliography: all_cites.bib
  sort_by: year
  order: descending

whitelist:
  - jekyll-scholar

