# _config.yml

title: Philip White

theme: minimal-mistakes-jekyll

author:
  name: "Philip White"
  avatar: /assets/images/headshot_background.jpg
  bio: |
    Assistant Professor<br>
    Brigham Young University<br>
    Department of Statistics<br>
    School of Medicine

plugins:
  - jekyll-include-cache
  - jekyll-scholar

include:
  - _pages
  - _bibliography

scholar:
  style: apa
  source: ./_bibliography
  bibliography: all_cites.bib
  sort_by: year
  order: descending
  limit: 1000

